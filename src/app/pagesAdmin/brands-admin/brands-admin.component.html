<p-table [value]="brands" class="table-container" [tableStyle]="{ 'min-width': '60rem' }">
    <ng-template #caption>
        <div class="flex items-center justify-between">
            <span class="text-xl font-bold">Marcas</span>
            <p-button icon="pi pi-refresh" rounded raised (click)="loadBrand()" />
        </div>
    </ng-template>
    <ng-template #header>
        <tr>
            <th>Nombre</th>
            <th>Imagen</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>
    </ng-template>
    <ng-template #body let-brand>
        <tr>
            <td>{{ brand.brandName }}</td>
            <td>
                <img [src]="brand.brandImage" [alt]="brand.brandName" class="w-24 rounded imagen-brands" />
            </td>
            <td>
                <i class="pi" [ngClass]="{'pi-check-circle text-green-500': brand.isActive, 'pi-times-circle text-red-500': !brand.isActive}"></i>
            </td>
            <td>
                <p-button icon="pi pi-pencil" pRipple class="button-action" (click)="editBrand(brand)"></p-button>
                <p-button icon="pi pi-trash" pRipple class="button-action" (click)="deleteBrand(brand.id)"></p-button>
            </td>
        </tr>
    </ng-template>
</p-table>

<p-dialog header="Edit Category" [(visible)]="visibleDialog" [style]="{ width: '30rem' }">
    <div class="flex flex-col gap-4">
        <div class="flex items-center gap-4">
            <label for="categoryName" class="font-semibold w-28">Name</label>
            <input pInputText id="categoryName" class="flex-auto" [(ngModel)]="selectedBrand.brandName" autocomplete="off" />
        </div>
        <div class="flex items-center gap-4">
            <label for="categoryImage" class="font-semibold w-28">Image</label>
            <input pInputText id="categoryImage" class="flex-auto" [(ngModel)]="selectedBrand.brandImage" autocomplete="off" />
        </div>
    </div>
    <div class="flex justify-end gap-2 mt-4">
        <p-button label="Save" (click)="saveBrand()" />
        <p-button label="Cancel" severity="secondary" (click)="visibleDialog = false" />
    </div>
</p-dialog>
