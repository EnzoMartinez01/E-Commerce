<div class="modal-overlay" (click)="close()">
    <div class="modal-content" (click)="$event.stopPropagation()">
        <div class="close-button">
            <button (click)="close()">
                <i class="pi pi-times"></i>
            </button>
        </div>
        <h2>Empresa</h2>
        <form (ngSubmit)="onSubmit()">
            <input type="text" class="form-control" id="username" name="username" [(ngModel)]="username" placeholder="Username" required />

            <input type="password" class="form-control" id="password" name="password" [(ngModel)]="password" placeholder="Password" required />

            <div class="input-group">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" value="" id="passwordRemember" />
                    <label class="form-check-label" for="passwordRemember">
                        Recordar Contraseña
                    </label>
                </div>
                <a href="#">¿Olvidaste tu contraseña?</a>
            </div>
            <div class="button-container">
                <button type="submit" [disabled]="isLoading">Iniciar Sesión</button>
                <div class="register">
                    <a href="#">¿No tienes cuenta? Regístrate</a>
                </div>
            </div>
            <div *ngIf="errorMessage" class="alert alert-danger mt-3">{{ errorMessage }}</div>
        </form>
    </div>
</div>
