<section class="contact-form-section">
    <form action="">
        <div class="mb-3">
            <input type="text" class="form-control" placeholder="Nombres / Representante">
            <input type="text" class="form-control" placeholder="Apellidos / Representante">
            <input type="text" class="form-control" placeholder="Razón Social Empresa">
            <input type="text" class="form-control" placeholder="Email">
            <div class="input-group">
                <input type="text" class="form-control" placeholder="DNI / RUC">
                <input type="text" class="form-control" placeholder="N° Celular">
            </div>
            <textarea name="message" class="form-control" id="message" placeholder="Mensaje"></textarea>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" value="" id="invalidCheck" required>
                <label class="form-check-label" for="invalidCheck">
                    He leído y estoy de acuerdo con los términos y condiciones de la web.
                </label>
                <div class="invalid-feedback">
                    You must agree before submitting.
                </div>
            </div>
            <div class="button-container">
                <button class="btn btn-primary" type="submit">Enviar</button>
            </div>
        </div>
    </form>
</section>
