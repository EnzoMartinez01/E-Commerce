<div class="payment-container">
  <div class="resumen-pago">
    <p>Envío: S/ {{ envio }}</p>
    <p><strong>Total a pagar: S/ {{ total }}</strong></p>
  </div>

  <section class="info-pago">
    <h3>Realiza el pago a:</h3>
    <p><strong>Yape:</strong> 999 999 999</p>
    <p><strong>BCP:</strong> 123-456-789</p>
    <img src="assets/qr.png" alt="QR Yape" width="200">
  </section>

  <form [formGroup]="paymentForm" (ngSubmit)="submit()">
    <label>Código de referencia:</label>
    <input type="text" formControlName="reference" required>

    <label>Sube tu voucher:</label>
    <input type="file" (change)="onFileChange($event)" required>

    <button type="submit">Finalizar</button>
  </form>
</div>
